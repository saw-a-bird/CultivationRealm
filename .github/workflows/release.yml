
name: Build CultivationRealm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name CultivationRealm CultivationRealm.py

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/CultivationRealm.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CultivationRealm.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CultivationRealm-Windows
          path: |
            dist/CultivationRealm.exe
            dist/SHA256SUMS.txt

      - name: Attest executable
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/CultivationRealm.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CultivationRealm.exe
            dist/SHA256SUMS.txt
