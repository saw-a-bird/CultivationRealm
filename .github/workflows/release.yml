
name: Build CultivationRealm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name CultivationRealm CultivationRealm.py

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/CultivationRealm.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CultivationRealm.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CultivationRealm-Windows
          path: |
            dist/CultivationRealm.exe
            dist/SHA256SUMS.txt

      - name: Attest executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/CultivationRealm.exe

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/CultivationRealm.exe
            dist/SHA256SUMS.txt