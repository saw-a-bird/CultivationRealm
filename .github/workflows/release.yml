
name: Build CultivationRealm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "MSIX version (four numbers, e.g. 1.0.0.0)"
        required: false
        default: "1.0.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name CultivationRealm CultivationRealm.py

      # Generate the MSIX version.
      - name: Determine package version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.package_version }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
              if ($env:GITHUB_REF_NAME -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
                  throw "Use release tags in the format v1.2.3"
              }

              $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          }
          else {
              $version = $env:INPUT_VERSION
          }

          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw "Invalid package version: $version"
          }

          $parts = $version.Split('.') | ForEach-Object { [int]$_ }

          if ($parts | Where-Object { $_ -gt 65535 }) {
              throw "Each version component must be between 0 and 65535."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX version: $version"

      # Prepare MSIX directory.
      - name: Prepare MSIX package
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $staging = "packaging/staging"

          if (Test-Path $staging) {
              Remove-Item $staging -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path "$staging/Assets" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          # Copy executable.
          Copy-Item "dist/CultivationRealm.exe" "$staging/CultivationRealm.exe"

          # Check and copy required assets.
          $assets = @(
              "StoreLogo.png",
              "Square150x150Logo.png",
              "Square44x44Logo.png"
          )

          foreach ($asset in $assets) {
              $source = "packaging/Assets/$asset"

              if (-not (Test-Path $source)) {
                  throw "Missing required MSIX asset: $source"
              }

              Copy-Item $source "$staging/Assets/$asset"
          }

          # Insert version into manifest.
          $manifest = Get-Content "packaging/Package.appxmanifest" -Raw
          $manifest = $manifest.Replace("__VERSION__", $env:APP_VERSION)

          Set-Content "$staging/AppxManifest.xml" -Value $manifest -Encoding utf8

      # Build unsigned MSIX for Microsoft Store.
      - name: Build MSIX package
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

          $makeAppx = Get-ChildItem $sdkRoot -Filter MakeAppx.exe -Recurse -File |
              Where-Object { $_.FullName -match '\\x64\\MakeAppx\.exe$' } |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1

          if (-not $makeAppx) {
              throw "MakeAppx.exe was not found."
          }

          $output = "dist/CultivationRealm.msix"

          & $makeAppx.FullName pack /d "packaging/staging" /p $output /o

          if ($LASTEXITCODE -ne 0) {
              throw "MSIX packaging failed."
          }

          # Validate generated package.
          & $makeAppx.FullName validate /p $output

          if ($LASTEXITCODE -ne 0) {
              throw "MSIX validation failed."
          }

          Write-Host "MSIX created successfully."

      # Generate checksums.
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash "dist/CultivationRealm.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  CultivationRealm.exe" |
              Out-File -Encoding ascii "dist/SHA256SUMS.txt"

          $msixHash = (Get-FileHash "dist/CultivationRealm.msix" -Algorithm SHA256).Hash.ToLower()
          "$msixHash  CultivationRealm.msix" |
              Out-File -Encoding ascii "dist/MSIX-SHA256SUMS.txt"

      # Upload original Windows executable.
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CultivationRealm-Windows
          path: |
            dist/CultivationRealm.exe
            dist/SHA256SUMS.txt

      # Upload MSIX separately for Partner Center.
      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CultivationRealm-MSIX-Store-Submission
          path: |
            dist/CultivationRealm.msix
            dist/MSIX-SHA256SUMS.txt

      # Attest executable.
      - name: Attest executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/CultivationRealm.exe

      # Attest MSIX.
      - name: Attest MSIX package
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/CultivationRealm.msix

      # Publish only the regular EXE on GitHub Releases.
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/CultivationRealm.exe
            dist/SHA256SUMS.txt